# yaml-language-server: $schema=../../../../../../../packages/python/agents/ygo74/agent_runtime/domains/configuration/schemas/agent.schema.json
name: mail-assistant
description: Example agent using shared and distinct MCP server configuration.
mcp_server: mail
skills:
  - find_mail
  - send_mail
  - search_archive
  - delegated_lookup
http:
  endpoints: [chat_completions, responses, mcp]
  security:
    mode: api_key
    api_key:
      value: ${MAIL_ASSISTANT_HTTP_API_KEY}
      header_name: X-API-Key
      user:
        subject: mail-assistant-service
        email: mail-assistant@example.test
  rate_limit:
    limits: [60/minute]
