[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ygo74-agent-runtime"
version = "0.1.0"
description = "Cross-language AI enterprise agent runtime"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typing-extensions>=4.12"
]

[project.optional-dependencies]
# Only required if you use ygo74.agent_runtime.create_langchain_agent_entrypoint.
langchain = ["langchain-core>=0.3"]
# Only required if you use ygo74.agent_runtime.create_agent_framework_entrypoint.
agent-framework = ["agent-framework-core>=1.0"]
