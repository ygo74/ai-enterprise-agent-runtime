[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ygo74-agent-runtime-agents"
version = "0.1.0"
description = "Agent hosting for the ygo74 agent runtime: endpoints, discovery, sessions and human approval"
requires-python = ">=3.12"

# Everything needed to host an agent: the contracts, the capability registry, the
# OpenAI/Anthropic endpoints, discovery, the conversation cache, the human-approval
# domain, and the MCP *client* an agent uses to reach tools.
dependencies = [
  "ygo74-agent-runtime-security==0.1.0",
  "pydantic>=2.7",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
# Serving the endpoints over HTTP. `fastapi` is imported defensively in
# `domains.endpoints.fastapi_endpoints`, so a host that only needs the contracts or
# the discovery descriptors installs none of this.
http = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

# Reaching tools through the Model Context Protocol - the client side. Only
# `domains.mcp` needs it, and that package imports the SDK defensively for the same
# reason `http` does.
#
# The upper bound is deliberate and was earned: `mcp` 2.0 moved to `httpx2` and
# removed `streamablehttp_client`, so an unbounded floor silently installed a major
# version this code cannot drive. Raising it is a migration, not a version bump.
mcp = [
  "mcp>=1.24,<2",
  "httpx>=0.27",
  "PyYAML>=6",
]

[tool.setuptools.packages.find]
include = ["ygo74*"]
namespaces = true

# One marker per package this distribution alone owns. See the security
# distribution's pyproject for why it cannot sit higher up.
[tool.setuptools.package-data]
"ygo74.agent_runtime.domains.configuration" = ["py.typed"]
"ygo74.agent_runtime.domains.contracts" = ["py.typed"]
"ygo74.agent_runtime.domains.discovery" = ["py.typed"]
"ygo74.agent_runtime.domains.endpoints" = ["py.typed"]
"ygo74.agent_runtime.domains.handlers" = ["py.typed"]
"ygo74.agent_runtime.domains.humanapproval" = ["py.typed"]
"ygo74.agent_runtime.domains.mapping" = ["py.typed"]
"ygo74.agent_runtime.domains.mcp" = ["py.typed"]
"ygo74.agent_runtime.domains.sessions" = ["py.typed"]
"ygo74.agent_runtime.domains.streaming" = ["py.typed"]
"ygo74.agent_runtime.middleware" = ["py.typed"]
"ygo74.agent_runtime.observability" = ["py.typed"]
"ygo74.agent_runtime.routing" = ["py.typed"]
