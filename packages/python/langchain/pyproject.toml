[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ygo74-agent-runtime-langchain"
version = "1.0.0"
description = "LangChain output integration for the ygo74 agent runtime"
readme = {text = "Typed LangChain result and streaming adapters for the neutral ygo74 agent runtime output contract. See docs/python/langchain.md in the project repository for installation, supported SDK versions, runnable offline examples, and explicit conversion diagnostics.", content-type = "text/plain"}
requires-python = ">=3.12"
dependencies = [
  "ygo74-agent-runtime-agents>=1.0.0,<2",
  "langchain-core>=1.6.3,<1.7",
]

[tool.setuptools.packages.find]
include = [
  "ygo74.agent_runtime.integrations.langchain",
  "ygo74.agent_runtime.integrations.langchain.*",
]
namespaces = true

[tool.setuptools.package-data]
"ygo74.agent_runtime.integrations.langchain" = ["py.typed"]
