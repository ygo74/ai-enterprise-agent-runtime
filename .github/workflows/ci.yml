name: CI

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-packages:
    name: Validate Python Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Python distributions
        run: |
          for project in security agents mcpserver meta langchain agentframework; do
            echo "::group::Build $project"
            python -m build --outdir "dist/$project" "packages/python/$project"
            echo "::endgroup::"
          done

      - name: Validate distributions with Twine
        run: |
          twine check dist/*/*

      - name: Validate independent wheel installations
        run: |
          for project in core langchain agentframework; do
            python -m venv ".package-check/$project"
            runtime=".package-check/$project/bin/python"
            "$runtime" -m pip install --find-links dist/security --find-links dist/agents dist/agents/*.whl
            if [ "$project" != core ]; then
              "$runtime" -m pip install --find-links dist/security --find-links dist/agents "dist/$project/"*.whl
            fi
            "$runtime" -m pip check
            "$runtime" -I -c '
          import importlib
          import importlib.resources
          import importlib.util
          import sys
          from ygo74.agent_runtime.domains.contracts.agent_output import AgentOutput
          selected = sys.argv[1]
          for integration, sdk in (("langchain", "langchain_core"), ("agentframework", "agent_framework")):
              installed = importlib.util.find_spec(sdk) is not None
              assert installed == (selected == integration), (selected, sdk, installed)
              if selected == integration:
                  module = importlib.import_module("ygo74.agent_runtime.integrations." + integration)
                  assert importlib.resources.files(module).joinpath("py.typed").is_file()
          ' "$project"
          done
          runtime=".package-check/agentframework/bin/python"
          "$runtime" -m pip install --find-links dist/security --find-links dist/agents dist/langchain/*.whl
          "$runtime" -m pip check
          "$runtime" -I -c 'import ygo74.agent_runtime.integrations.langchain; import ygo74.agent_runtime.integrations.agentframework'

  test-python:
    name: Run Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies and runtime packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest pytest-asyncio anyio jsonschema
          python -m pip install -e packages/python/security
          python -m pip install -e "packages/python/agents[http,mcp]"
          python -m pip install -e "packages/python/mcpserver[http]"
          python -m pip install -e packages/python/meta
          python -m pip install -e packages/python/langchain
          python -m pip install -e packages/python/agentframework
          python -m pip install -r docs/examples/python-langchain-fastapi/01-get-started/requirements.txt -r docs/examples/python-langchain-fastapi/04-human-in-the-loop/requirements.txt -r docs/examples/python-langchain-fastapi/05-rag/requirements.txt

      - name: Lint with Ruff
        run: |
          python -m ruff check packages/python tests

      - name: Execute pytest
        run: |
          python -m pytest tests/ docs/examples/python-agentframework-fastapi/test_agentframework_fastapi_example.py --junitxml=python-test-results.xml

      - name: Publish Python Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "python-test-results.xml"
          check_name: "Python Test Results"
          check_run: "false"
          comment_mode: "off"

  test-dotnet:
    name: Run .NET Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build .NET solution
        run: dotnet build packages/dotnet/Ygo74.AgentRuntime.sln -c Release

      - name: Test .NET solution
        run: dotnet test tests/dotnet/AgentRuntime.Tests.csproj -c Release --logger "trx;LogFileName=dotnet-test-results.trx"

      - name: Publish .NET Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/dotnet-test-results.trx"
          check_name: ".NET Test Results"
          check_run: "false"
          comment_mode: "off"
