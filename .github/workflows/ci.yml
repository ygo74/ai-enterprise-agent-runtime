name: CI

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate-packages:
    name: Validate Python Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Python distributions
        run: |
          for project in security agents mcpserver meta; do
            echo "::group::Build $project"
            python -m build --outdir "dist/$project" "packages/python/$project"
            echo "::endgroup::"
          done

      - name: Validate distributions with Twine
        run: |
          twine check dist/*/*

  test-python:
    name: Run Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies and runtime packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest pytest-asyncio anyio
          python -m pip install -e packages/python/security
          python -m pip install -e "packages/python/agents[http,mcp]"
          python -m pip install -e "packages/python/mcpserver[http]"
          python -m pip install -e packages/python/meta

      - name: Lint with Ruff
        run: |
          python -m ruff check packages/python tests

      - name: Execute pytest
        run: |
          python -m pytest tests/ --junitxml=python-test-results.xml

      - name: Publish Python Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "python-test-results.xml"
          check_name: "Python Test Results"

  test-dotnet:
    name: Run .NET Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build .NET solution
        run: dotnet build packages/dotnet/Ygo74.AgentRuntime.sln -c Release

      - name: Test .NET solution
        run: dotnet test tests/dotnet/AgentRuntime.Tests.csproj -c Release --logger "trx;LogFileName=dotnet-test-results.trx"

      - name: Publish .NET Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/dotnet-test-results.trx"
          check_name: ".NET Test Results"


