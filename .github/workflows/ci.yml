name: CI

on:
  push:
    branches: [ main, master, "feature/*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-packages:
    name: Validate Python Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Python distributions
        run: |
          for project in security agents mcpserver meta; do
            echo "::group::Build $project"
            python -m build --outdir "dist/$project" "packages/python/$project"
            echo "::endgroup::"
          done

      - name: Validate distributions with Twine
        run: |
          twine check dist/*/*

  test-python:
    name: Run Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies and runtime packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio anyio
          python -m pip install -e packages/python/security
          python -m pip install -e "packages/python/agents[http,mcp]"
          python -m pip install -e "packages/python/mcpserver[http]"
          python -m pip install -e packages/python/meta

      - name: Execute pytest
        run: |
          python -m pytest tests/

